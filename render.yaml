services:
  # Free-demo deployment: no persistent disk or always-on worker.
  - type: web
    name: ai-inbox-copilot-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh scripts/render-free-start.sh
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SYNC_EXECUTION_MODE
        value: request
      # Render free instances have ephemeral storage. PostgreSQL remains durable;
      # the derived Chroma search index is rebuilt on a later user sync if needed.
      - key: CHROMA_PERSIST_DIRECTORY
        value: /tmp/chromadb
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: MAX_REQUEST_BYTES
        value: "1000000"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: GENAI_MAX_RETRIES
        value: "3"
      - key: MISTRAL_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-inbox-copilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-inbox-copilot-queue
          property: connectionString
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: keyvalue
    name: ai-inbox-copilot-queue
    region: oregon
    plan: free
    ipAllowList: []

databases:
  - name: ai-inbox-copilot-db
    region: oregon
    plan: free
    databaseName: inbox_copilot
    user: inbox_copilot
