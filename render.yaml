services:
  - type: web
    name: ai-inbox-copilot-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh scripts/render-start.sh
    healthCheckPath: /health/ready
    disk:
      name: inbox-copilot-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_REQUEST_BYTES
        value: "1000000"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-inbox-copilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-inbox-copilot-queue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: ai-inbox-copilot-queue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: ai-inbox-copilot-queue
          property: connectionString
      - key: CHROMA_PERSIST_DIRECTORY
        value: /app/data/chromadb
      - key: GMAIL_TOKEN_FILE
        value: /app/data/gmail/token.json
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: GENAI_MAX_RETRIES
        value: "3"
      - key: SYNC_LOCK_TTL_SECONDS
        value: "1800"
      - key: QUEUED_JOB_STALE_SECONDS
        value: "120"
      # Values below are entered only in Render's secret prompt/dashboard.
      - key: MISTRAL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: keyvalue
    name: ai-inbox-copilot-queue
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: ai-inbox-copilot-db
    region: singapore
    plan: basic-256mb
    databaseName: inbox_copilot
    user: inbox_copilot
