<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>AI Inbox Copilot — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 32rem);
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        padding: 2rem;
        background: white;
        box-shadow: 0 18px 45px rgb(15 23 42 / 0.08);
        text-align: center;
      }
      img { width: 4rem; height: 4rem; }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
      button {
        margin-top: 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        background: #4f46e5;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192x192.png" alt="" />
      <h1>You are offline</h1>
      <p>Reconnect to access Gmail, sync messages and use AI features. Private inbox and API responses are never stored in the offline cache.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
